name: Tests

# Tests JavaScript (interface) et Rust sur macOS et Windows, et vérification que l'application se construit.
# Déclenché par les pull requests et par les pushes sur main (pas de doublon sur les branches).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Tests Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: npm ci

      - name: Tests de l'interface (JavaScript)
        run: npm test

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Construire l'installeur
        run: npx tauri build --bundles nsis

  macos:
    name: Tests macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: npm ci

      - name: Tests de l'interface (JavaScript)
        run: npm test

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Construire l'application
        run: npx tauri build --bundles app
