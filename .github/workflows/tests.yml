name: Tests

# Tests sur Windows et macOS, et construction du .dmg macOS téléchargeable (artefact).
# Déclenché par les pull requests et par les pushes sur main (pas de doublon sur les branches).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      mac_runner: ${{ steps.runner.outputs.value }}
    steps:
      - name: Choisir le runner macOS (Mac personnel si en ligne, sinon GitHub)
        id: runner
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          # Le Mac personnel n'est jamais utilisé pour les pull requests (dépôt public).
          if [ "$EVENT" != "pull_request" ] && \
             gh api "repos/$REPO/actions/runners" --jq '.runners[] | select(.status=="online" and any(.labels[]; .name=="macOS")) | .name' 2>/dev/null | grep -q .; then
            echo 'value=["self-hosted","macOS"]' >> "$GITHUB_OUTPUT"
            echo "Mac personnel en ligne : utilisé."
          else
            echo 'value="macos-latest"' >> "$GITHUB_OUTPUT"
            echo "Mac personnel indisponible : runner GitHub utilisé."
          fi

  windows:
    name: Tests Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances de test
        run: python -m pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest

  macos:
    name: Tests macOS
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.mac_runner) }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer Python 3.11 (Mac personnel)
        if: runner.environment == 'self-hosted'
        run: |
          brew install python@3.11 || true
          "$(brew --prefix python@3.11)/bin/python3.11" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances de test
        run: python3 -m pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python3 -m pytest

      - name: Compiler l'application
        run: python3 build_exe.py

      - name: Installer create-dmg
        run: brew install create-dmg

      - name: Créer le .dmg
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          mkdir -p release
          installer/make_dmg.sh "$VERSION" "build_portable/PicTone_v${VERSION}_macOS.app" "release/PicTone_v${VERSION}_macOS.dmg"

      - name: Publier le .dmg (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: PicTone-macOS-dmg
          path: release/*.dmg
          if-no-files-found: error
