name: Tests

# Tests Rust sur macOS et vérification que l'application se construit.
# Déclenché par les pull requests et par les pushes sur main (pas de doublon sur les branches).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Tests macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer le CLI Tauri
        run: npm ci

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Construire l'application
        run: npx tauri build --bundles app
