name: Tests

# Tests sur Windows et macOS, et construction du .dmg macOS téléchargeable (artefact).
# Déclenché par les pull requests et par les pushes sur main (pas de doublon sur les branches).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Tests Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances de test
        run: python -m pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest

  macos:
    name: Tests macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances de test
        run: python3 -m pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python3 -m pytest

      - name: Compiler l'application
        run: python3 build_exe.py

      - name: Créer le .dmg
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE" release
          cp -R "build_portable/PicTone_v${VERSION}.app" "$STAGE/PicTone.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "PicTone ${VERSION}" -srcfolder "$STAGE" -ov -format UDZO \
            "release/PicTone_v${VERSION}-macOS.dmg"

      - name: Publier le .dmg (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: PicTone-macOS-dmg
          path: release/*.dmg
          if-no-files-found: error
