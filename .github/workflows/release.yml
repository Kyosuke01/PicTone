name: Release

# Publie une Release GitHub (tag vX.Y.Z + exe + msix) à chaque push sur main
# qui modifie version.txt.
on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "Version invalide : $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Vérifier que la release n'existe pas déjà
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::La release ${{ steps.version.outputs.tag }} existe déjà, rien à faire."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.exists.outputs.exists == 'false'
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        if: steps.exists.outputs.exists == 'false'
        run: python -m pip install -r requirements.txt

      - name: Compiler (.exe + .msix)
        if: steps.exists.outputs.exists == 'false'
        run: python build_msix.py

      - name: Test de démarrage de l'exécutable
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        run: |
          $exe = "Executables/PicTone_v${{ steps.version.outputs.version }}.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Error "PicTone s'est fermé au démarrage (code $($p.ExitCode))."
            $log = Join-Path $env:LOCALAPPDATA "PicTone/logs/crash_log.txt"
            if (Test-Path $log) { Get-Content $log }
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Démarrage OK."

      - name: Empreintes SHA256
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        run: |
          Get-ChildItem Executables -Include *.exe,*.msix -Recurse | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append -Encoding ascii Executables/SHA256SUMS.txt
          }

      - name: Publier la release
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(Executables/*.exe Executables/SHA256SUMS.txt)
          ls Executables/*.msix >/dev/null 2>&1 && FILES+=(Executables/*.msix)
          gh release create "${{ steps.version.outputs.tag }}" "${FILES[@]}" \
            --target "${{ github.sha }}" \
            --title "PicTone ${{ steps.version.outputs.tag }}" \
            --generate-notes
