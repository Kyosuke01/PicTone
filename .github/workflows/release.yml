name: Release

# Publie une Release GitHub (tag vX.Y.Z) à chaque push sur main qui modifie version.txt.
# Assets : PicTone_Setup_vX.Y.Z.exe (installeur), PicTone_vX.Y.Z.exe (portable, utilisé
# par la mise à jour automatique) et SHA256SUMS.txt.
on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "Version invalide : $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Vérifier que la release n'existe pas déjà
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::La release ${{ steps.version.outputs.tag }} existe déjà, rien à faire."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.exists.outputs.exists == 'false'
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances Python
        if: steps.exists.outputs.exists == 'false'
        run: python -m pip install -r requirements.txt

      - name: Compiler l'exécutable portable
        if: steps.exists.outputs.exists == 'false'
        run: python build_exe.py

      - name: Test de démarrage de l'exécutable
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = "Executables/PicTone_v$env:VERSION.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "PicTone/logs/crash_log.txt"
            if (Test-Path $log) { Get-Content $log }
            throw "PicTone s'est fermé au démarrage (code $($p.ExitCode))."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Démarrage OK."

      - name: Compiler l'installeur (Inno Setup)
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" installer\PicTone.iss
          if ($LASTEXITCODE -ne 0) { throw "Échec de la compilation de l'installeur." }

      - name: Tester l'installeur (installation puis désinstallation silencieuses)
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = "Executables/PicTone_Setup_v$env:VERSION.exe"
          $install = Join-Path $env:LOCALAPPDATA "Programs\PicTone"
          $app = Join-Path $install "PicTone.exe"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\PicTone\PicTone.lnk"

          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (-not (Test-Path $app)) { throw "Fichier installé introuvable : $app" }
          if (-not (Test-Path $shortcut)) { throw "Raccourci du menu Démarrer absent." }

          $p = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "PicTone installé s'est fermé au démarrage (code $($p.ExitCode))." }
          Stop-Process -Id $p.Id -Force

          $uninstaller = Join-Path $install "unins000.exe"
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (Test-Path $app) { throw "La désinstallation n'a pas supprimé PicTone.exe." }
          Write-Host "Installation et désinstallation OK."

      - name: Empreintes SHA256
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        run: |
          Get-ChildItem Executables -Filter *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append -Encoding ascii Executables/SHA256SUMS.txt
          }

      - name: Publier la release
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            Executables/PicTone_Setup_v*.exe Executables/PicTone_v*.exe Executables/SHA256SUMS.txt \
            --target "${{ github.sha }}" \
            --title "PicTone ${{ steps.version.outputs.tag }}" \
            --generate-notes
