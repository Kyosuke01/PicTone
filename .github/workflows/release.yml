name: Release

# Publie une Release GitHub (tag vX.Y.Z) à chaque push sur main qui modifie version.txt.
# Assets publiés :
#   - PicTone_vX.Y.Z_macOS.dmg             application macOS (signée et notarisée)
#   - SHA256SUMS.txt
on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "Version invalide : $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Vérifier que la release n'existe pas déjà
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::La release v${{ steps.version.outputs.version }} existe déjà, rien à faire."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    # Runner GitHub (et non un Mac personnel) : ce job reçoit les secrets de signature.
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer le CLI Tauri
        run: npm ci

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Compiler l'application
        run: npx tauri build --bundles app

      - name: Test de lancement de l'application
        run: |
          APP="src-tauri/target/release/bundle/macos/PicTone.app/Contents/MacOS/pictone"
          "$APP" > "$RUNNER_TEMP/pictone.log" 2>&1 &
          PID=$!
          sleep 15
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$RUNNER_TEMP/pictone.log"
            echo "PicTone s'est fermé au démarrage."
            exit 1
          fi
          kill "$PID"

      - name: Installer create-dmg
        run: brew install create-dmg

      - name: Importer le certificat de signature (trousseau temporaire)
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for var in P12_BASE64 P12_PASSWORD API_KEY_P8 API_KEY_ID API_ISSUER_ID; do
            if [ -z "${!var}" ]; then echo "::error::Secret $var manquant : release non signée refusée."; exit 1; fi
          done

          P12="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"

          KEYCHAIN="$RUNNER_TEMP/pictone-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then echo "::error::Aucun certificat Developer ID Application valide dans le trousseau."; exit 1; fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s\n' "$API_KEY_P8" > "$KEY_PATH"

          {
            echo "MACOS_KEYCHAIN=$KEYCHAIN"
            echo "MACOS_SIGN_IDENTITY=$IDENTITY"
            echo "APPLE_API_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Signer, notariser et créer le .dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p release
          installer/sign_and_notarize.sh "$VERSION" "src-tauri/target/release/bundle/macos/PicTone.app" "release/PicTone_v${VERSION}_macOS.dmg"

      - name: Supprimer le trousseau et les clés temporaires
        if: always()
        run: |
          [ -n "${MACOS_KEYCHAIN:-}" ] && security delete-keychain "$MACOS_KEYCHAIN" || true
          rm -f "${APPLE_API_KEY_PATH:-/nonexistent}" "$RUNNER_TEMP/certificate.p12"

      - name: Publier le .dmg (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg
          if-no-files-found: error

  publish:
    needs: [prepare, macos]
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Empreintes SHA256
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publier la release
        run: |
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "PicTone $TAG" \
            --generate-notes
