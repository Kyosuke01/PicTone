name: Release

# Publie une Release GitHub (tag vX.Y.Z) à chaque push sur main qui modifie version.txt.
# Assets publiés :
#   - PicTone_vX.Y.Z_Windows.exe           installeur Windows (utilisé par la mise à jour automatique)
#   - PicTone_vX.Y.Z_Windows-portable.exe  version portable Windows
#   - PicTone_vX.Y.Z_macOS.dmg             application macOS
#   - SHA256SUMS.txt
on:
  push:
    branches: [main]
    paths: [version.txt]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "Version invalide : $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Vérifier que la release n'existe pas déjà
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::La release v${{ steps.version.outputs.version }} existe déjà, rien à faire."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances Python
        run: python -m pip install -r requirements.txt

      - name: Tests unitaires
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Compiler l'application
        run: python build_exe.py

      - name: Test de démarrage (portable, avant installeur)
        shell: pwsh
        run: |
          $exe = "build_portable/PicTone_v${env:VERSION}_Windows.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA "PicTone/logs/crash_log.txt"
            if (Test-Path $log) { Get-Content $log }
            throw "PicTone s'est fermé au démarrage (code $($p.ExitCode))."
          }
          # PyInstaller --onefile lance un processus enfant : on arrête toutes les instances.
          Get-Process -Name PicTone -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Démarrage OK."

      - name: Compiler l'installeur (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force release | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" installer\PicTone.iss
          if ($LASTEXITCODE -ne 0) { throw "Échec de la compilation de l'installeur." }

      - name: Tester l'installeur (installation puis désinstallation silencieuses)
        shell: pwsh
        run: |
          $setup = "release/PicTone_v${env:VERSION}_Windows.exe"
          $install = Join-Path $env:LOCALAPPDATA "Programs\PicTone"
          $app = Join-Path $install "PicTone.exe"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\PicTone\PicTone.lnk"

          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          if (-not (Test-Path $app)) { throw "Fichier installé introuvable : $app" }
          if (-not (Test-Path $shortcut)) { throw "Raccourci du menu Démarrer absent." }

          $p = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "PicTone installé s'est fermé au démarrage (code $($p.ExitCode))." }
          Get-Process -Name PicTone -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          # Inno Setup relance une copie de son désinstalleur depuis %TEMP% : on attend le résultat.
          $uninstaller = Join-Path $install "unins000.exe"
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $deadline = (Get-Date).AddSeconds(90)
          while ((Test-Path $app) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
          if (Test-Path $app) { throw "La désinstallation n'a pas supprimé PicTone.exe." }
          Write-Host "Installation et désinstallation OK."

      - name: Préparer le portable
        shell: pwsh
        run: Copy-Item "build_portable/PicTone_v${env:VERSION}_Windows.exe" "release/PicTone_v${env:VERSION}_Windows-portable.exe"

      - name: Publier les fichiers Windows (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  macos:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances Python
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m pytest

      - name: Compiler l'application
        run: python3 build_exe.py

      - name: Test de lancement de l'application
        run: |
          APP="build_portable/PicTone_v${VERSION}_macOS.app/Contents/MacOS/PicTone_v${VERSION}_macOS"
          "$APP" > "$RUNNER_TEMP/pictone.log" 2>&1 &
          PID=$!
          sleep 15
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$RUNNER_TEMP/pictone.log"
            echo "PicTone s'est fermé au démarrage."
            exit 1
          fi
          kill "$PID"

      - name: Installer create-dmg
        run: brew install create-dmg

      - name: Créer le .dmg
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          mkdir -p release
          installer/make_dmg.sh "$VERSION" "build_portable/PicTone_v${VERSION}_macOS.app" "release/PicTone_v${VERSION}_macOS.dmg"

      - name: Publier le .dmg (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg
          if-no-files-found: error

  publish:
    needs: [prepare, windows, macos]
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Empreintes SHA256
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publier la release
        run: |
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "PicTone $TAG" \
            --generate-notes
